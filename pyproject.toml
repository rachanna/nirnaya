[project]
name = "nirnaya"
version = "0.1.0"
description = "Dispute decision agent for Airwallex: decides which disputes to fight and refuses unprovable claims."
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1.0",
    "openai>=3.37.0",
    "pydantic>=2.7",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nirnaya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
# Formula variables (A, R, F_pa) are upper-case by convention, which SIM300 mistakes for constants.
ignore = ["SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The ban below applies only to the deterministic core.
"!nirnaya/{models,evidence,engine,verifier}/**" = ["TID251"]

# The deterministic core (models, evidence, engine, verifier) must have no randomness,
# no network and no LLM. tests/test_determinism.py enforces the same rule by AST scan.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "engine/verifier must be deterministic"
"secrets".msg = "engine/verifier must be deterministic"
"socket".msg = "engine/verifier must not do network I/O"
"urllib".msg = "engine/verifier must not do network I/O"
"http".msg = "engine/verifier must not do network I/O"
"httpx".msg = "engine/verifier must not do network I/O"
"requests".msg = "engine/verifier must not do network I/O"
"anthropic".msg = "engine/verifier must not call an LLM"
"time".msg = "the deterministic core must not read the clock"
"uuid".msg = "the deterministic core must not generate ids"
"os".msg = "the deterministic core must not read the environment"
